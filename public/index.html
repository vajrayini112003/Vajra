<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="sckgmqVxLsmDsV05yuwGL0YsE07y8MGbnEnmnudKU00" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vajrayini</title>
  <meta name="description" content="Vajrayini is a Technical Trainer specializing in Java, Python, Full Stack Development, UI/UX Design and programming workshops for college students.">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="header-row">
      <img class="avatar" id="avatar" src="/img/vajrayini.png" alt="Vajrayini">
      <div>
        <h1 id="p-name">Vajrayini</h1>
        <div class="role" id="p-title">Technical Trainer</div>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stats">
        <div><b id="stat-colleges">—</b>college visited</div>
        <div><b id="stat-students">—</b>students trained</div>
        <div><b id="stat-rating">—</b>feedback rating</div>
      </div>
      <label class="month-bar">Month &amp; year
        <input type="month" id="month-pick">
      </label>
    </div>
  </header>

  <main id="college-view"><div class="empty-state">Loading…</div></main>

  <section class="card" id="feedback-card" style="display:none">
    <h3>Leave your feedback</h3>
    <form id="feedback-form">
      <div class="field-row">
        <div class="field"><label for="f-name">Your name</label><input type="text" id="f-name" required></div>
        <div class="field"><label for="f-dept">Department</label><input type="text" id="f-dept" placeholder="e.g. CSE" required></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-year">Year</label>
          <select id="f-year" required>
            <option value="">Select</option><option>1st year</option><option>2nd year</option><option>3rd year</option><option>4th year</option>
          </select>
        </div>
        <div class="field">
          <label>Rating</label>
          <div class="star-picker" id="star-picker"><span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span></div>
        </div>
      </div>
      <div class="field"><label for="f-comment">Feedback</label><textarea id="f-comment" required placeholder="How was the class?"></textarea></div>
      <button class="btn" type="submit">Submit feedback</button>
      <div class="msg" id="form-msg"></div>
    </form>
  </section>
  <div class="feedback-list" id="feedback-list"></div>

  <footer class="footer">
    <a href="/admin.html">admin</a>
  </footer>
</div>

<div class="clg-picker" id="clg-picker">
  <div class="clg-menu" id="clg-menu" hidden></div>
  <button class="btn" id="clg-btn" type="button">Colleges ▴</button>
</div>
<script src="/js/home.js"></script>
</body>
</html>
